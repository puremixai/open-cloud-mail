<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#F1F1F1" id="theme-color-meta">
  <meta name="description" content="PureMail 是一个 Serverless 响应式邮箱服务，支持邮件发送，可部署到 Cloudflare 平台，降低服务器成本。PureMail is a serverless responsive email service that supports email sending and can be deployed on Cloudflare to reduce server costs.">
  <title>PureMail</title>
  <link rel="icon" href="/mail.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script>
    const uiStoreStr =  localStorage.getItem('ui')
    if (uiStoreStr) {
      const uiStore =  JSON.parse(uiStoreStr)
      const root = document.documentElement
      const metaTag = document.getElementById('theme-color-meta');
      const isMobile =  !window.matchMedia("(pointer: fine) and (hover: hover)").matches;
      /* 一次性迁移：默认主题改为 Win95，此后由用户自主选择 */
      if (!localStorage.getItem('win95-default-v1')) {
        uiStore.win95 = true
        localStorage.setItem('ui', JSON.stringify(uiStore))
        localStorage.setItem('win95-default-v1', '1')
      }
      if (uiStore.win95) {
        root.setAttribute('class', 'win95');
        metaTag.setAttribute('content', '#c0c0c0');
      } else {
        root.setAttribute('class', uiStore.dark ? 'dark' : '');
        metaTag.setAttribute('content', uiStore.dark ? (isMobile ? '#141414' : '#000000') : (isMobile ? '#FFFFFF' : '#F1F1F1'));
      }
    } else {
      /* 新用户：默认 Win95 主题（与 ui store 默认值一致） */
      document.documentElement.setAttribute('class', 'win95');
      document.getElementById('theme-color-meta').setAttribute('content', '#c0c0c0');
    }
  </script>
</head>
<style>
  html {
    background: #FFFFFF;
  }
  .dark {
    background: #141414;
  }
  .win95 {
    background: #008080;
  }
</style>
<body>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
